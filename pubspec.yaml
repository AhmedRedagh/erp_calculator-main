name: erp_calculator
description: >
  A pure-Dart, stateless billing calculation engine that handles tax modes
  (exclusive / inclusive / none), item-level discounts, and bill-level
  discounts with a full step-by-step audit trail.
version: 1.0.0
repository: https://github.com/AhmedRedagh/erp_calculator-main
issue_tracker: https://github.com/AhmedRedagh/erp_calculator-main/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ^1.9.0

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
